<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Image Gallery</title>
<link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/1375/1375106.png"> 
<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:Poppins, Arial, sans-serif;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  padding:40px 20px;
}

.title{
  text-align:center;
  font-size:2.5rem;
  margin-bottom:20px;
}

/* CONTROLS */
.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:25px;
}

.controls input[type="search"]{
  padding:10px 15px;
  width:220px;
  border-radius:25px;
  border:1px solid #ccc;
  outline:none;
}

.controls input[type="file"]{
  display:none;
}

.upload-btn{
  padding:10px 20px;
  background:#667eea;
  color:white;
  border-radius:25px;
  cursor:pointer;
}

/* FILTER BUTTONS */
.filters{text-align:center;margin-bottom:30px;}

.filters button{
  padding:10px 22px;
  margin:5px;
  border:none;
  border-radius:25px;
  background:linear-gradient(135deg,#a18cd1,#fbc2eb);
  color:white;
  cursor:pointer;
}

.filters button.active{
  background:linear-gradient(135deg,#667eea,#764ba2);
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

/* SINGLE IMAGE FIX */
.gallery.single{
  justify-content:center;
}
.gallery.single .card{
  max-width:260px;
}

/* CARD */
.card{
  position:relative;
  /* animation hata diya, ab animation sirf fade-in class mein rahega */
}

/* Animation class for fade */
.fade-in {
  animation:fade 0.5s ease forwards;
}

@keyframes fade{
  from{opacity:0;transform:scale(0.9);}
  to{opacity:1;transform:scale(1);}
}

.card img{
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:18px;
  cursor:pointer;
  box-shadow:0 15px 35px rgba(0,0,0,0.18);
}
.card img:hover{
  scale: 1.1;
}

/* ACTION BUTTON */
.action-btn{
  position:absolute;
  bottom:10px;
  right:10px;
  padding:6px 14px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-size:13px;
}

.delete{background:#ff4b4b;color:white;}
.restore{background:#2ecc71;color:white;}

/* LIGHTBOX */
.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.lightbox img{
  width:80vw;
  height:80vh;
  max-width:900px;
  max-height:550px;
  object-fit:contain;
  border-radius:14px;
}

.close,.prev,.next{
  position:absolute;
  color:white;
  font-size:40px;
  cursor:pointer;
}

.close{top:20px;right:30px;}
.prev{left:20px;}
.next{right:20px;} 

/* ===========================
   RESPONSIVE DESIGN
=========================== */

/* LARGE SCREENS */
@media (min-width:1200px){
  .gallery{
    grid-template-columns:repeat(4,1fr);
  }
}

/* TABLETS */
@media (max-width:768px){
  body{
    padding:25px 12px;
  }

  .title{
    font-size:2rem;
  }

  .controls{
    flex-direction:column;
    align-items:center;
  }

  .controls input[type="search"]{
    width:100%;
    max-width:320px;
  }

  .filters button{
    padding:8px 16px;
    font-size:14px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:18px;
  }

  .card img{
    height:200px;
  }
}

/* MOBILE PHONES */
@media (max-width:480px){
  .title{
    font-size:1.6rem;
  }

  .filters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
  }

  .filters button{
    margin:4px;
    font-size:13px;
    padding:7px 14px;
  }

  .gallery{
    grid-template-columns:1fr;
  }

  .card img{
    height:190px;
  }

  .action-btn{
    font-size:12px;
    padding:5px 12px;
  }

  .lightbox img{
    width:92vw;
    height:80vh;
  }

  .close,.prev,.next{
    font-size:32px;
  }
}

</style>
</head>

<body>

<h1 class="title">Image Gallery</h1>

<!-- SEARCH + UPLOAD -->
<div class="controls">
  <input type="search" placeholder="Search category..." onkeyup="searchCategory(this.value)">
  <label class="upload-btn">
    Upload Image
    <input type="file" accept="image/*" onchange="uploadImage(event)">
  </label>
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="active" onclick="setView('all',this, true)">All</button>
  <button onclick="setView('flowers',this)">Flowers</button>
  <button onclick="setView('places',this)">Places</button>
  <button onclick="setView('humans',this)">Humans</button>
  <button onclick="setView('animals',this)">Animals</button>
  <button onclick="setView('recycle',this)">Recycle Bin</button>
</div>

<!-- GALLERY -->
<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">✖</span>
  <span class="prev" onclick="changeImage(-1)">❮</span>
  <img id="lightboxImage">
  <span class="next" onclick="changeImage(1)">❯</span>
</div>

<script>
let images=[
 {src:"https://tse4.mm.bing.net/th/id/OIP.tT7UG7QNOQKvijhtgqq2lAHaE8",cat:"flowers"},
 {src:"https://tse4.mm.bing.net/th/id/OIP.oWScGxjOKVManxowh95M8AHaE8",cat:"flowers"},
 {src:"https://tse4.mm.bing.net/th/id/OIP.Vtxy0FjT_EfudI4cQk1kzAHaE8",cat:"flowers"},
 {src:"https://tse4.mm.bing.net/th/id/OIP.dcPVoSVEerKSppejfFsljQHaE5",cat:"flowers"},

 {src:"https://tse4.mm.bing.net/th/id/OIP.Vz2gnk9UmrTBYXhJ2ygCFAHaEu",cat:"places"},
 {src:"https://tse4.mm.bing.net/th/id/OIP.y_l2lm510yM5dUbkMuls0QHaE7",cat:"places"},
 {src:"https://tse2.mm.bing.net/th/id/OIP.Mrb3AaWQU2sQQOKkkmvTYgHaE8",cat:"places"},
 {src:"https://tse1.mm.bing.net/th/id/OIP.4YkZ-vk-nF0mxuVt-q2NsgHaE7",cat:"places"},

 {src:"https://tse1.mm.bing.net/th/id/OIP.lTVRqQRf7Bq7UiX2zMiK3QHaE8",cat:"humans"},
 {src:"https://tse2.mm.bing.net/th/id/OIP.DnQq__W5pibltm9H65jDLQHaE8",cat:"humans"},
 {src:"https://tse1.mm.bing.net/th/id/OIP._1F70zmusmGw7AdTC8O9wAHaE8",cat:"humans"},
 {src:"https://tse1.mm.bing.net/th/id/OIP.hIuJO0PIE2kRkLgyTLis5AHaFj",cat:"humans"},

 {src:"https://tse2.mm.bing.net/th/id/OIP.7XER4pj83u31ACy5dhxGhAHaEK",cat:"animals"},
 {src:"https://tse4.mm.bing.net/th/id/OIP.llqUqM6RGqvVNpoFaSW-vwHaFj",cat:"animals"},
 {src:"https://tse4.mm.bing.net/th/id/OIP.-15_9rp1nRdFBCqLgpdtTgHaEK",cat:"animals"},
 {src:"https://tse4.mm.bing.net/th/id/OIP.rzuG6aaYj4EV_FB9PEm3RgHaFj",cat:"animals"},
];

let recycleBin=[];
let currentView="all";
let visibleImages=[];
let currentIndex=0;

/* RENDER */
function render(data, animate = false){
  gallery.innerHTML="";
  gallery.classList.remove("single");

  if(data.length===1){
    gallery.classList.add("single");
  }

  data.forEach((img,i)=>{
    gallery.innerHTML+=`
      <div class="card ${animate ? "fade-in" : ""}">
        <img src="${img.src}" onclick="openLightbox(${i})">
        ${
          currentView==="recycle"
          ? `<button class="action-btn restore" onclick="restoreImage(${i})">Restore</button>`
          : `<button class="action-btn delete" onclick="deleteImage(${images.indexOf(img)})">Delete</button>`
        }
      </div>
    `;
  });

  visibleImages=data;
}

/* VIEW */
function setView(view,btn, animate = false){
  currentView=view;
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  let data = view==="recycle" ? recycleBin :
             view==="all" ? images :
             images.filter(i=>i.cat===view);

  render(data, animate);
}

/* SEARCH */
function searchCategory(text){
  text=text.toLowerCase();
  if(!text){ 
    setView(currentView,document.querySelector(".active"), false); 
    return;
  }

  let result=images.filter(i=>i.cat.includes(text));
  render(result, false);
}

/* UPLOAD */
function uploadImage(e){
  let file=e.target.files[0];
  if(!file) return;

  let reader=new FileReader();
  reader.onload=()=>{
    images.push({src:reader.result,cat:"uploaded"});
    setView("all",document.querySelector(".filters button"), true);
  };
  reader.readAsDataURL(file);
}

/* DELETE & RESTORE */
function deleteImage(i){
  recycleBin.push(images[i]);
  images.splice(i,1);
  setView(currentView,document.querySelector(".active"), false);
}

function restoreImage(i){
  images.push(recycleBin[i]);
  recycleBin.splice(i,1);
  setView("recycle",document.querySelector(".active"), false);
}

/* LIGHTBOX */
function openLightbox(i){
  currentIndex=i;
  lightbox.style.display="flex";
  lightboxImage.src=visibleImages[i].src;
}
function closeLightbox(){lightbox.style.display="none";}
function changeImage(d){
  currentIndex=(currentIndex+d+visibleImages.length)%visibleImages.length;
  lightboxImage.src=visibleImages[currentIndex].src;
}

/* INIT */
setView("all",document.querySelector(".filters button"), true);
</script>

</body>
</html>
